<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>体重监测</title>
  <meta name="theme-color" content="#2f7555" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header>
      <div>
        <p class="eyebrow">本地数据 · 无需联网</p>
        <h1>体重监测</h1>
      </div>
      <button id="settingsButton" class="secondary">设置资料</button>
    </header>

    <section class="card">
      <h2 id="formTitle">记录体重</h2>
      <form id="recordForm">
        <input id="recordId" type="hidden" />
        <label>日期<input id="date" type="date" required /></label>
        <label>时段<select id="period"><option value="morning">早</option><option value="evening">晚</option></select></label>
        <label>体重（kg）<input id="weight" type="number" min="1" max="500" step="0.01" placeholder="例如 65.25" required /></label>
        <label class="wide">备注（可选）<input id="note" type="text" maxlength="100" placeholder="例如：晨起空腹" /></label>
        <div class="actions wide">
          <button type="submit">保存记录</button>
          <button id="cancelEdit" type="button" class="secondary hidden">取消编辑</button>
        </div>
      </form>
    </section>

    <section class="summary" aria-label="体重概览">
      <div class="card metric"><span>最新体重</span><strong id="latestWeight">—</strong></div>
      <div class="card metric"><span>当前 BMI</span><strong id="latestBmi">—</strong></div>
      <div class="card metric"><span>相对首条变化</span><strong id="weightChange">—</strong></div>
    </section>

    <section class="card">
      <div class="section-head"><h2>经期记录</h2><span id="cycleHint"></span></div>
      <form id="periodForm" class="period-form"><label>本次月经第一天<input id="periodStartDate" type="date" required /></label><button type="submit">记录经期开始</button></form>
      <div class="period-summary"><div><span>下次经期预计</span><strong id="nextPeriod">—</strong></div><div><span>周期设置</span><strong id="cycleSettings">—</strong></div></div>
      <p class="medical-note">预测仅用于个人记录与提醒，不可用于避孕、诊断或替代医疗建议。</p>
      <div id="periodHistory" class="period-history"></div>
    </section>

    <section class="card">
      <div class="section-head"><h2>体重趋势</h2><div class="file-actions"><select id="trendRange" aria-label="趋势范围"><option value="month">当前月</option><option value="threeMonths">近三个月</option><option value="all">全部记录</option></select><span id="chartHint"></span></div></div>
      <p class="chart-legend"><span class="legend morning"></span>早上体重 <span class="legend evening"></span>傍晚体重</p>
      <div class="chart-wrap"><canvas id="trendChart" aria-label="体重趋势图，可直接拖动虚线查看日期体重"></canvas><strong id="chartDetail" class="chart-detail hidden">—</strong><p id="emptyChart">添加记录后将在这里显示趋势。</p></div>
    </section>

    <section class="card">
      <div class="section-head"><h2 id="calendarTitle">体重与经期日历</h2><div class="file-actions"><button id="previousMonth" class="secondary">上月</button><button id="nextMonth" class="secondary">下月</button></div></div>
      <p class="calendar-legend"><span class="legend period-actual"></span>实际经期 <span class="legend period-predicted"></span>预计经期 <span class="legend follicular"></span>卵泡期 <span class="legend ovulation"></span>排卵期 <span class="legend luteal"></span>黄体期</p>
      <p id="calendarPrompt" class="calendar-prompt hidden">请先在“经期记录”中录入本次月经第一天，日历才会显示各阶段。</p>
      <div class="calendar-weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
      <div id="calendarGrid" class="calendar-grid"></div>
    </section>

    <section class="card">
      <div class="section-head"><h2>历史记录</h2><div class="file-actions"><button id="exportButton" class="secondary">导出 CSV</button><label class="secondary import-label">导入 CSV<input id="importInput" type="file" accept=".csv,text/csv" /></label></div></div>
      <div class="table-wrap"><table><thead><tr><th>日期</th><th>时段</th><th>体重</th><th>BMI</th><th>备注</th><th>操作</th></tr></thead><tbody id="recordsBody"></tbody></table></div>
      <p id="emptyTable" class="empty">还没有记录。</p>
    </section>
  </main>

  <dialog id="settingsDialog"><form id="settingsForm" method="dialog"><h2>个人资料与经期设置</h2><label>用户名称<input id="userName" type="text" maxlength="30" placeholder="例如：小王" /></label><label>身高（cm）<input id="height" type="number" min="50" max="250" step="0.1" required /></label><label>周期长度（天）<input id="cycleLength" type="number" min="15" max="60" step="1" required /></label><label>经期长度（天）<input id="periodLength" type="number" min="1" max="15" step="1" required /></label><p class="dialog-note">BMI 会按新身高自动重新计算；周期预测按以上设置计算。</p><div class="actions"><button type="submit">保存</button><button id="closeSettings" type="button" class="secondary">取消</button></div></form></dialog>
  <script src="app.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');</script>
</body>
</html>
